<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Launcher — tvOS 风格电视启动器预览</title>
<style>
:root{
  --card-w:150px; --card-h:210px; --radius:18px;
  --scale:1.08; --glow:.6;
  --accent:#E8EAED;
  --bg1:#16181D; --bg2:#0B0C0F;
  --anim:200ms;
  --focus:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
html,body{height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#bg{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));transition:background 300ms}
#glow{position:fixed;inset:0;pointer-events:none;transition:background 400ms;
  background:radial-gradient(ellipse 65% 60% at 30% 42%,rgba(31,111,235,.45),transparent 70%);
  opacity:var(--glow)}
#stage{position:fixed;inset:0;padding:28px 56px;display:flex;flex-direction:column;color:#fff}

/* 顶栏 */
#topbar{display:flex;justify-content:space-between;align-items:center;flex:none}
#topbar .logo{font-size:24px;font-weight:700;color:var(--accent)}
#topbar .right{display:flex;align-items:center;gap:20px}
#clock{font-size:22px;font-weight:300;color:rgba(255,255,255,.85);letter-spacing:1px}
#gear{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.10);
  display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;
  transition:all var(--anim) ease;color:var(--accent)}
#gear.focused{transform:scale(var(--scale));background:var(--accent);color:#000}

/* Top Shelf */
#shelf{margin-top:20px;height:170px;border-radius:22px;padding:28px;display:flex;align-items:center;gap:24px;flex:none;
  background:linear-gradient(90deg,rgba(31,111,235,.85),rgba(31,111,235,.25));
  transition:background 400ms, height var(--anim)}
#shelf.hidden{display:none}
#shelf .icon{width:88px;height:88px;border-radius:18px;background:rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
#shelf .name{font-size:34px;font-weight:700}
#shelf .sub{font-size:15px;color:rgba(255,255,255,.75);margin-top:8px}

/* 行 */
.rowlabel{font-size:19px;font-weight:500;color:rgba(255,255,255,.75);margin:26px 0 14px;flex:none}
.row{display:flex;gap:26px;flex:none}
.row.contentrow{gap:18px}
.rows-wrap{flex:1;display:flex;flex-direction:column;min-height:0;justify-content:flex-start}
#contentrows{flex:1;min-height:0;display:flex;flex-direction:column}

/* 卡片 */
.card{flex:none;width:var(--card-w);height:var(--card-h);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:700;color:#fff;
  cursor:pointer;transition:transform var(--anim) ease,box-shadow var(--anim),border var(--anim) ease;
  border:0 solid transparent;position:relative}
.card.poster{width:210px;height:132px;border-radius:calc(var(--radius)*.8);font-size:0}
.card.poster .inner{padding:16px;display:flex;flex-direction:column;gap:6px}
.card.poster .t{font-size:17px;font-weight:600}
.card.poster .s{font-size:12px;color:rgba(255,255,255,.7)}
.card.focused{transform:scale(var(--scale));border:3px solid var(--focus);
  box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:2}

/* 设置面板 */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none}
#panel{position:fixed;top:0;right:0;bottom:0;width:560px;background:rgba(28,28,34,.95);
  backdrop-filter:blur(18px);border-left:1px solid rgba(255,255,255,.10);
  padding:28px 40px;display:none;flex-direction:column;color:#fff}
#panel.open,#scrim.open{display:flex}
#panel h2{font-size:32px;font-weight:700}
#panel .hint{font-size:13px;color:rgba(255,255,255,.5);margin-top:6px}
#rows{flex:1;overflow-y:auto;margin-top:20px;display:flex;flex-direction:column;gap:12px;padding-right:6px}
#rows::-webkit-scrollbar{width:0}
.srow{display:flex;align-items:center;gap:12px;border-radius:14px;padding:14px 22px;
  background:rgba(255,255,255,.05);transition:all 120ms;border:2px solid transparent}
.srow.focused{background:rgba(255,255,255,.12);border-color:var(--accent);transform:scale(1.03)}
.srow .lbl{flex:1;font-size:18px}
.srow .val{font-size:16px;font-weight:600;color:var(--accent);min-width:70px;text-align:center}
.btn{width:44px;height:44px;border-radius:10px;background:rgba(255,255,255,.10);color:var(--accent);
  font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.srow.focused .btn{background:var(--accent);color:#000}
.sw{width:56px;height:30px;border-radius:15px;background:rgba(255,255,255,.15);position:relative;flex:none}
.sw .knob{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left 150ms}
.sw.on{background:var(--accent)} .sw.on .knob{left:30px}
.srow.action{justify-content:center;font-weight:500;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div><div id="glow"></div>

<div id="stage">
  <div id="topbar">
    <div class="logo">TV Launcher</div>
    <div class="right">
      <div id="clock">20:00</div>
      <div id="gear" data-type="gear" title="设置">⚙</div>
    </div>
  </div>
  <div id="shelf"><div class="icon">🎬</div>
    <div><div class="name" id="shelfName">影视中心</div><div class="sub">最近使用 · 按下 OK 键打开</div></div>
  </div>
  <div class="rowlabel">我的应用</div>
  <div class="row" id="approw"></div>
  <div id="contentrows">
    <div class="rowlabel">热门推荐</div>
    <div class="row contentrow" id="row1"></div>
    <div class="rowlabel">继续观看</div>
    <div class="row contentrow" id="row2"></div>
  </div>
</div>

<div id="scrim"></div>
<div id="panel">
  <h2>设置</h2>
  <div class="hint">全部界面调整都在这里 · ←→ 调整数值 · ↑↓ 移动 · Esc 返回</div>
  <div id="rows"></div>
</div>

<script>
/* ------------------------- 数据 ------------------------- */
const apps=[
 {n:'影视中心',c:'#1F6FEB',e:'🎬'},{n:'音乐',c:'#E5484D',e:'🎵'},
 {n:'游戏大厅',c:'#8E4EC6',e:'🎮'},{n:'应用商店',c:'#30A46C',e:'🛍'},
 {n:'浏览器',c:'#F76B15',e:'🌐'},{n:'相册',c:'#0EA5E9',e:'🖼'},
 {n:'直播',c:'#D6409F',e:'📺'},{n:'天气',c:'#12A594',e:'☀'}
];
const posters=[
 {t:'星际远航',s:'科幻 · 2024',c:'#3D5AFE'},{t:'山海食肆',s:'美食 · 纪录',c:'#F76B15'},
 {t:'极速狂飙',s:'动作 · 2023',c:'#E5484D'},{t:'静谧森林',s:'自然 · 4K',c:'#30A46C'},
 {t:'城市之光',s:'剧情 · 2024',c:'#8E4EC6'},{t:'雪国列车',s:'悬疑 · 2022',c:'#0EA5E9'}];
const resume=[
 {t:'大江大河 第2集',s:'上次看到 35:10',c:'#12A594'},{t:'世界美食之旅',s:'上次看到 12:40',c:'#D6409F'},
 {t:'宇宙时空之旅',s:'上次看到 51:02',c:'#3D5AFE'}];

/* ------------------------- 设置状态（对应安卓端全部参数） ------------------------- */
const ACCENTS=[['铂金白','#E8EAED'],['经典蓝','#2F6FED'],['活力橙','#F76B15'],['神秘紫','#8E4EC6'],['翡翠绿','#30A46C'],['玫瑰红','#E5484D']];
const WALLS=[['深空黑','#16181D','#0B0C0F'],['午夜蓝','#0D1B3E','#060B18'],['暗夜紫','#2B1B4D','#120A24'],['松石绿','#0C3B3E','#071A1C'],['熔岩红','#3B0D0D','#170404']];
let S={cardW:150,cardH:210,radius:18,scale:1.08,glow:.6,accent:0,wall:0,
  clock:true,shelf:true,rows:true,h24:true,anim:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('tvlauncher')||'{}'))}catch(e){}
function save(){localStorage.setItem('tvlauncher',JSON.stringify(S))}

/* ------------------------- 渲染 ------------------------- */
const approw=document.getElementById('approw');
apps.forEach((a,i)=>{
  const d=document.createElement('div');d.className='card';d.dataset.type='app';d.dataset.i=i;
  d.style.background=`linear-gradient(180deg,${a.c}E6,${a.c}80)`;
  d.textContent=a.e;d.title=a.n;
  d.onclick=()=>alert(`打开「${a.n}」`);
  approw.appendChild(d);
});
function fillRow(el,data){
  data.forEach(p=>{const d=document.createElement('div');d.className='card poster';
    d.innerHTML=`<div class="inner" style="border-left:4px solid ${p.c};padding-left:14px">
      <div class="t">${p.t}</div><div class="s">${p.s}</div></div>`;
    d.style.background=`linear-gradient(180deg,${p.c}CC,${p.c}66)`;
    d.dataset.type='poster';el.appendChild(d);});
}
fillRow(document.getElementById('row1'),posters);
fillRow(document.getElementById('row2'),resume);

function apply(){
  const r=document.documentElement.style;
  r.setProperty('--card-w',S.cardW+'px');r.setProperty('--card-h',S.cardH+'px');
  r.setProperty('--radius',S.radius+'px');r.setProperty('--scale',S.scale);
  r.setProperty('--glow',S.glow);r.setProperty('--anim',S.anim+'ms');
  r.setProperty('--accent',ACCENTS[S.accent][1]);
  const w=WALLS[S.wall];
  r.setProperty('--bg1',w[1]);r.setProperty('--bg2',w[2]);
  const fa=apps[focus.i%apps.length];
  const g=document.getElementById('glow');
  g.style.background=`radial-gradient(ellipse 65% 60% at 30% 42%,${hexA(fa.c,S.glow*.45)},transparent 70%)`;
  const sh=document.getElementById('shelf');
  sh.classList.toggle('hidden',!S.shelf);
  sh.style.background=`linear-gradient(90deg,${hexA(fa.c,.85)},${hexA(fa.c,.25)})`;
  document.getElementById('shelfName').textContent=fa.n;
  document.getElementById('clock').style.display=S.clock?'block':'none';
  document.getElementById('contentrows').style.display=S.rows?'flex':'none';
}
function hexA(h,a){const n=parseInt(h.slice(1),16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

/* 时钟 */
function tick(){const d=new Date();let h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);
  if(!S.h24){const ap=h>=12?'下午':'上午';h=h%12||12;document.getElementById('clock').textContent=`${('0'+h).slice(-2)}:${m} ${ap}`}
  else document.getElementById('clock').textContent=`${('0'+h).slice(-2)}:${m}`}
tick();setInterval(tick,5000);

/* ------------------------- 遥控导航 ------------------------- */
let focus={row:0,i:0};
const gear=document.getElementById('gear');
function rowEls(r){
  if(r===-1)return [gear];
  if(r===0)return [...approw.children];
  if(r===1)return [...document.getElementById('row1').children];
  if(r===2)return [...document.getElementById('row2').children];
  return [];
}
function renderFocus(){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('focused'));
  gear.classList.remove('focused');
  const els=rowEls(focus.row);
  if(focus.row===-1)gear.classList.add('focused');
  else if(els[focus.i])els[focus.i].classList.add('focused');
  if(focus.row===0){const a=apps[focus.i%apps.length];
    document.getElementById('glow').style.background=
      `radial-gradient(ellipse 65% 60% at 30% 42%,${hexA(a.c,S.glow*.45)},transparent 70%)`;
    document.getElementById('shelf').style.background=
      `linear-gradient(90deg,${hexA(a.c,.85)},${hexA(a.c,.25)})`;
    document.getElementById('shelfName').textContent=a.n;}
  if(els[focus.i])els[focus.i].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
}
renderFocus();

document.addEventListener('keydown',e=>{
  if(panelOpen){panelKey(e);return}
  switch(e.key){
    case 'ArrowRight':{const els=rowEls(focus.row);
      if(focus.row===-1){focus.row=0;focus.i=0}
      else if(focus.i<els.length-1)focus.i++;break}
    case 'ArrowLeft':{if(focus.row===-1)break;
      if(focus.i>0)focus.i--;else focus.row=-1;break}
    case 'ArrowDown':{if(focus.row<2&&!(!S.shelf&&false))focus.row++;
      focus.i=Math.min(focus.i,rowEls(focus.row).length-1);break}
    case 'ArrowUp':{if(focus.row>0)focus.row--;
      if(focus.row>=0)focus.i=Math.min(focus.i,rowEls(focus.row).length-1);break}
    case 'Enter':{if(focus.row===-1)openPanel();
      else{const els=rowEls(focus.row);if(els[focus.i])els[focus.i].click()}break}
    default:return;
  }
  e.preventDefault();renderFocus();
});

/* ------------------------- 设置面板 ------------------------- */
let panelOpen=false,pFocus=0;
const panel=document.getElementById('panel'),scrim=document.getElementById('scrim'),rowsEl=document.getElementById('rows');
const DEFS=[
 {id:'cardW',label:'卡片宽度',type:'step',min:110,max:230,step:10,fmt:v=>v+' dp'},
 {id:'cardH',label:'卡片高度',type:'step',min:160,max:290,step:10,fmt:v=>v+' dp'},
 {id:'radius',label:'圆角半径',type:'step',min:0,max:36,step:3,fmt:v=>v+' dp'},
 {id:'scale',label:'焦点缩放',type:'step',min:1,max:1.2,step:.02,fmt:v=>Math.round(v*100)+' %'},
 {id:'glow',label:'背景氛围光',type:'step',min:0,max:1,step:.1,fmt:v=>Math.round(v*100)+' %'},
 {id:'accent',label:'强调色',type:'opt',opts:ACCENTS.map(a=>a[0])},
 {id:'wall',label:'壁纸',type:'opt',opts:WALLS.map(w=>w[0])},
 {id:'anim',label:'动画速度',type:'opt',opts:['快','标准','慢'],map:[120,200,300]},
 {id:'clock',label:'显示时钟',type:'tog'},
 {id:'shelf',label:'显示 Top Shelf',type:'tog'},
 {id:'rows',label:'显示内容推荐行',type:'tog'},
 {id:'h24',label:'24 小时制',type:'tog'},
 {id:'reset',label:'恢复默认设置',type:'act'},
 {id:'close',label:'返回主界面',type:'act'}
];
function valOf(d){return d.type==='opt'?(d.map?d.map[S[d.id]]:S[d.id]):S[d.id]}
function buildPanel(){
  rowsEl.innerHTML='';
  DEFS.forEach((d,idx)=>{
    const r=document.createElement('div');r.className='srow';r.dataset.idx=idx;
    if(d.type==='act'){
      r.classList.add('action');r.textContent=d.label;
      r.onclick=()=>{if(d.id==='reset'){S={cardW:150,cardH:210,radius:18,scale:1.08,glow:.6,accent:0,wall:0,clock:true,shelf:true,rows:true,h24:true,anim:1};save();buildPanel();apply()}else closePanel()};
    }else{
      const l=document.createElement('div');l.className='lbl';l.textContent=d.label;
      r.appendChild(l);
      if(d.type==='step'||d.type==='opt'){
        const m=document.createElement('div');m.className='btn';m.textContent='−';
        const v=document.createElement('div');v.className='val';
        const p=document.createElement('div');p.className='btn';p.textContent='+';
        const adjust=dir=>{
          if(d.type==='step'){let x=S[d.id]+dir*d.step;
            if(d.id==='scale'||d.id==='glow')x=Math.round(x*100)/100;
            S[d.id]=Math.min(d.max,Math.max(d.min,x))}
          else{let i=S[d.id]+dir;if(i<0)i=d.opts.length-1;if(i>=d.opts.length)i=0;S[d.id]=i}
          save();v.textContent=valText(d);apply()};
        m.onclick=()=>adjust(-1);p.onclick=()=>adjust(1);
        v.textContent=valText(d);
        r.appendChild(m);r.appendChild(v);r.appendChild(p);
      }else if(d.type==='tog'){
        const t=document.createElement('div');t.className='sw'+(S[d.id]?' on':'');
        t.innerHTML='<div class="knob"></div>';
        r.appendChild(t);
        r.onclick=()=>{S[d.id]=!S[d.id];save();t.classList.toggle('on');apply()};
      }
    }
    rowsEl.appendChild(r);
  });
  markPanelFocus();
}
function valText(d){return d.type==='opt'
  ?`${d.opts[S[d.id]]}  (${S[d.id]+1}/${d.opts.length})`
  :d.fmt(S[d.id])}
function markPanelFocus(){
  rowsEl.querySelectorAll('.srow').forEach((r,i)=>r.classList.toggle('focused',i===pFocus));
  const el=rowsEl.children[pFocus];if(el)el.scrollIntoView({block:'nearest'});
}
function openPanel(){panelOpen=true;pFocus=0;panel.classList.add('open');scrim.classList.add('open');buildPanel()}
function closePanel(){panelOpen=false;panel.classList.remove('open');scrim.classList.remove('open')}
function panelKey(e){
  const d=DEFS[pFocus];
  if(e.key==='ArrowUp'){pFocus=(pFocus-1+DEFS.length)%DEFS.length;markPanelFocus()}
  else if(e.key==='ArrowDown'){pFocus=(pFocus+1)%DEFS.length;markPanelFocus()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    if(d.type==='act')return;
    const dir=e.key==='ArrowRight'?1:-1;
    const row=rowsEl.children[pFocus];
    if(d.type==='tog'||d.type==='opt'||d.id==='scale'||d.id==='glow'||d.id==='radius'){row.click&&row.onclick&&null}
    if(d.type==='tog'){row.click()}
    else{const btn=row.children[dir===1?3:1];if(btn)btn.click()}
  }
  else if(e.key==='Enter'){
    if(d.type==='act')rowsEl.children[pFocus].click();
    else if(d.type==='tog')rowsEl.children[pFocus].click();
    else{const btn=rowsEl.children[pFocus].children[3];if(btn)btn.click()}
  }
  else if(e.key==='Escape')closePanel();
  else return;
  e.preventDefault();
}
scrim.onclick=closePanel;
document.getElementById('gear').onclick=openPanel;

apply();renderFocus();
</script>
</body>
</html>
